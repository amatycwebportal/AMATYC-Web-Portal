version: "3.8"

services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: 836551052423.dkr.ecr.us-east-2.amazonaws.com/tpsewebportal/backend:latest
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    expose:
      - "4000"

  frontend:
    image: 836551052423.dkr.ecr.us-east-2.amazonaws.com/tpsewebportal/frontend:latest
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
